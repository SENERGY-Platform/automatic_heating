name: 'PROD build'

# master builds :vX.Y.Z; a release/vN branch keeps an older major alive and builds only
# its :vN.x.y. :prod stays on the last build before the port, which pipelines started from
# it keep running; retag.yml moves it. The git tag is pushed after the image, so a failed
# build never consumes a version.
on:
  push:
    branches:
      - master
      - 'release/v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/senergy-platform/automatic_heating

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install uv==0.11.6 && uv sync --frozen
      - name: Test
        run: uv run --frozen python -m unittest discover -s tests -t .

  # Settles the commit to build and its version. The manifest is regenerated here, so the
  # commit can be a new one that the push did not contain; the build jobs check that one
  # out. This is why the image is not built by docker/github-builder, which always builds
  # the pushed commit.
  prepare:
    needs: [test]
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      tags: ${{ steps.tags.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # The platform registers a version from the manifest at its tag, so the manifest is
      # regenerated and committed before the version is computed, built and tagged.
      - name: Regenerate the operator manifest
        run: |
          python -m pip install uv==0.11.6
          uv sync --frozen
          uv run --frozen python -m operator_lib manifest main.py
          if [ -n "$(git status --porcelain -- operator-manifest.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add operator-manifest.json
            git commit -m 'chore: regenerate the operator manifest [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Commit to build
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Version
        id: version
        run: echo "tag=$(.github/scripts/next-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "$IMAGE:${{ steps.version.outputs.tag }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  # One native runner per platform, arm64 without QEMU. Each pushes its image by digest
  # only; merge puts both under the tags. The Dockerfile copies .git from the checkout
  # to read the commit.
  build:
    needs: [prepare]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Put both platforms under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ needs.prepare.outputs.tag }}"
      - name: Push version tag
        run: |
          tag='${{ needs.prepare.outputs.tag }}'
          if [ -z "$(git tag --points-at HEAD --list "$tag")" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi

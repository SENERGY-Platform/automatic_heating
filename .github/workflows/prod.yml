name: 'PROD build'

# master builds :vX.Y.Z; a release/vN branch keeps an older major alive and builds only
# its :vN.x.y. :prod stays on the last build before the port, which pipelines started from
# it keep running; retag.yml moves it. The git tag is pushed after the image, so a failed
# build never consumes a version.
on:
  push:
    branches:
      - master
      - 'release/v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install uv==0.11.6 && uv sync --frozen
      - name: Test
        run: uv run --frozen python -m unittest discover -s tests -t .

  multi:
    needs: [test]
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "tag=$(.github/scripts/next-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "ghcr.io/senergy-platform/automatic_heating:${{ steps.version.outputs.tag }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
      - name: Push version tag
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if [ -z "$(git tag --points-at HEAD --list "$tag")" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi

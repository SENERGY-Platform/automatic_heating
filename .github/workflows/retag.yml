name: 'Retag image'

# Points a tag (default :prod) at an existing build, without building. Going back is
# running this with the earlier version or digest as source.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'existing version tag (vX.Y.Z) or digest (sha256:...)'
        required: true
      target:
        description: 'tag to move'
        required: true
        default: 'prod'

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$SOURCE" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|sha256:[0-9a-f]{64})$ ]] || { echo "bad source: $SOURCE" >&2; exit 1; }
          [[ "$TARGET" =~ ^[a-z][a-z0-9._-]{0,63}$ && ! "$TARGET" =~ ^v[0-9] ]] || { echo "bad target: $TARGET" >&2; exit 1; }
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Retag
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
        run: |
          image=ghcr.io/senergy-platform/automatic_heating
          if [[ "$SOURCE" == sha256:* ]]; then src="$image@$SOURCE"; else src="$image:$SOURCE"; fi
          # --prefer-index=false keeps a single-platform build at its own digest
          docker buildx imagetools create --prefer-index=false -t "$image:$TARGET" "$src"
          docker buildx imagetools inspect "$image:$TARGET"
